name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'fix/[0-9]+.[0-9]+.x'
      - '[0-9]+.x'

permissions:
  contents: read
  packages: write
  security-events: write

env:
  IMAGE_NAME: ghcr.io/prathammalavi/onecx-shell-ui

jobs:
  codeql:
    uses: onecx/ci-angular/.github/workflows/angular-codeql.yml@v1
    secrets: inherit

  angular:
    uses: onecx/ci-angular/.github/workflows/angular-build.yml@v1
    secrets: inherit

  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: angular

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "branch=$(echo '${{ github.ref_name }}' | tr '/' '-')" >> $GITHUB_OUTPUT

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.sha_short }}
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.branch }}
            ${{ env.IMAGE_NAME }}:latest

  sonar:
    uses: onecx/ci-angular/.github/workflows/angular-sonar.yml@v1
    needs: docker
    secrets: inherit
